<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — PC Centre</title>
  <meta name="description" content="Log in to your PC Centre account.">
  <meta name="theme-color" content="#0d1822">
  <link rel="icon" href="logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <div class="auth">
      <div class="side">
        <img src="img/slider/tech-developer-setup-stockcake.jpg" alt="">
        <h1>Welcome back</h1>
        <p>Log in to keep your cart and saved items.</p>
      </div>
      <div class="form-side">
        <div class="inner">
          <h2>Log in</h2>
          <p class="muted">New here? <a href="signup.html">Create an account</a></p>
          <form id="login-form" novalidate>
            <div id="auth-note" class="notice" role="status"></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"><div class="error"></div></div>
            <div class="field"><label for="password">Password</label><div class="pw-wrap"><input id="password" type="password" autocomplete="current-password"><button type="button" data-toggle-pw aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><div class="error"></div></div>
            <button class="btn btn-primary btn-block" type="submit">Log in</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
