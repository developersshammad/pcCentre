<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — PC Centre</title>
  <meta name="description" content="Contact PC Centre by email, phone or WhatsApp.">
  <meta name="theme-color" content="#0d1822">
  <link rel="icon" href="logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/motion.css" rel="stylesheet">
  <script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('motion');setTimeout(function(){var h=document.querySelector('.hero');if(h)h.classList.add('is-in')},3000)}</script>
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / Contact</div>
        <h1>Contact us</h1>
        <p>Questions about a product, an order or a warranty claim? Send us a message.</p>
      </div>
    </section>

    <section class="section" style="padding-top:40px">
      <div class="wrap contact-grid">
        <form class="panel" id="contact-form" novalidate>
          <div id="contact-note" class="notice" role="status"></div>
          <div class="row-2">
            <div class="field"><label for="name">Name</label><input id="name" type="text" autocomplete="name"><div class="error"></div></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><div class="error"></div></div>
          </div>
          <div class="field">
            <label for="topic">Topic</label>
            <select id="topic">
              <option>Product question</option>
              <option>Order status</option>
              <option>Warranty or repair</option>
              <option>Become a dealer</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field"><label for="message">Message</label><textarea id="message" placeholder="Tell us what you need help with"></textarea><div class="error"></div></div>
          <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send message</button>
        </form>
        <ul class="contact-list">
          <li><i class="fa-brands fa-whatsapp" aria-hidden="true"></i><div><strong>WhatsApp</strong><a href="https://wa.me/923001234567" target="_blank" rel="noopener">Chat with us</a></div></li>
          <li><i class="fa-solid fa-phone" aria-hidden="true"></i><div><strong>Phone</strong><a href="tel:+923001234567">+92 300 1234567</a></div></li>
          <li><i class="fa-solid fa-envelope" aria-hidden="true"></i><div><strong>Email</strong><a href="mailto:info@pccentre.com">info@pccentre.com</a></div></li>
          <li><i class="fa-solid fa-location-dot" aria-hidden="true"></i><div><strong>Store</strong><span>Main Tech Market, Saddar, Karachi</span></div></li>
          <li><i class="fa-regular fa-clock" aria-hidden="true"></i><div><strong>Hours</strong><span>Monday to Saturday, 11am – 9pm</span></div></li>
        </ul>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
