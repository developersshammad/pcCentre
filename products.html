<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — PC Centre</title>
  <meta name="description" content="Browse 108 computer products across 12 categories with prices in rupees.">
  <meta name="theme-color" content="#0d1822">
  <link rel="icon" href="logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="products">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs"><a href="index.html">Home</a> / Products</div>
        <h1 id="cat-heading">All products</h1>
        <p id="cat-blurb"></p>
      </div>
    </section>

    <section class="section" style="padding-top:32px">
      <div class="wrap shop">
        <aside class="filters" id="filters" aria-label="Filter by category"></aside>
        <div>
          <div class="cat-chips" id="cat-chips" aria-label="Filter by category"></div>
          <form class="toolbar" id="search-form" role="search">
            <div class="search">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <label class="sr-only" for="q">Search products</label>
              <input id="q" type="search" placeholder="Search by name, brand or spec (e.g. DDR5, 4K)" autocomplete="off">
            </div>
            <label class="sr-only" for="sort">Sort products</label>
            <select id="sort">
              <option value="featured">Sort: Featured</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </form>
          <p class="result-line" id="result-line" aria-live="polite"></p>
          <div class="grid" id="product-grid"></div>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
