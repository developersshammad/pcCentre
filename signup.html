<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — PC Centre</title>
  <meta name="description" content="Create a PC Centre account for deals and faster checkout.">
  <meta name="theme-color" content="#0d1822">
  <link rel="icon" href="logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/motion.css" rel="stylesheet">
  <script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('motion');setTimeout(function(){var h=document.querySelector('.hero');if(h)h.classList.add('is-in')},3000)}</script>
</head>
<body data-page="signup">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <div class="auth">
      <div class="side">
        <img src="img/slider/bf-laptop-deals-pcw-13.jpg" alt="">
        <h1>Join PC Centre</h1>
        <p>An account gives you:</p>
        <ul>
          <li><i class="fa-solid fa-tag" aria-hidden="true"></i>Early access to deals</li>
          <li><i class="fa-solid fa-heart" aria-hidden="true"></i>A saved list of products</li>
          <li><i class="fa-solid fa-bolt" aria-hidden="true"></i>Faster checkout</li>
        </ul>
      </div>
      <div class="form-side">
        <div class="inner">
          <h2>Create your account</h2>
          <p class="muted">Already have one? <a href="login.html">Log in</a></p>
          <form id="signup-form" novalidate>
            <div id="auth-note" class="notice" role="status"></div>
            <div class="row-2">
              <div class="field"><label for="first">First name</label><input id="first" type="text" autocomplete="given-name"><div class="error"></div></div>
              <div class="field"><label for="last">Last name</label><input id="last" type="text" autocomplete="family-name"><div class="error"></div></div>
            </div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email"><div class="error"></div></div>
            <div class="field"><label for="phone">Mobile number</label><input id="phone" type="tel" autocomplete="tel" placeholder="0300 1234567"><div class="error"></div></div>
            <div class="row-2">
              <div class="field"><label for="password">Password</label><div class="pw-wrap"><input id="password" type="password" autocomplete="new-password"><button type="button" data-toggle-pw aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><div class="hint">At least 8 characters</div><div class="error"></div></div>
              <div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password"><div class="error"></div></div>
            </div>
            <div class="field">
              <span style="display:block;font-weight:600;font-size:.92rem;margin-bottom:6px">Account type</span>
              <div class="radio-group">
                <label><input type="radio" name="type" value="personal" checked> Personal</label>
                <label><input type="radio" name="type" value="business"> Business</label>
              </div>
            </div>
            <div class="field"><label class="check"><input id="terms" type="checkbox"> I agree to the terms and privacy policy</label><div class="error"></div></div>
            <div class="field"><label class="check"><input id="news" type="checkbox"> Email me deals and new arrivals</label></div>
            <button class="btn btn-primary btn-block" type="submit">Create account</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
